# Terminates TLS for app.local and proxies to a local app on :3333.
# server_name must match a SAN in the cert (gen-certs.sh adds the domain and *.domain).
server {
    listen 443 ssl;
    server_name app.local;

    ssl_certificate     /etc/nginx/certs/app.local.crt;
    ssl_certificate_key /etc/nginx/certs/app.local.key;

    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;   # websockets
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# Optional: send plain http to https.
server {
    listen 80;
    server_name app.local;
    return 301 https://$host$request_uri;
}
